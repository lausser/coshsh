; coshsh cookbook skeleton.
; INI file. Section names matter — they are picked up by prefix:
;   [recipe_*]          → a coshsh-cook run target
;   [datasource_*]      → an input source
;   [datarecipient_*]   → an output sink
;   [mapping_*]         → a lookup table referenced via @{NAME[key]}
;   [defaults]          → values inherited by every recipe
;
; Variable substitution:
;   %(VAR)%             — env var or value from same/another section
;   @{MAPPING[key]}     — lookup in [mapping_MAPPING]

[defaults]
classes_dir = ./classes
templates_dir = ./templates
log_level = info

; --- recipe ------------------------------------------------------------
[recipe_prod]
; comma-separated, evaluated in order; later datasources can enrich
; what earlier ones produced.
datasources = inventory,monitoring_db
datarecipients = >>>recipient,prometheus_sd
classes_dir = ./classes,/etc/coshsh/classes
templates_dir = ./templates
objects_dir = /etc/nagios/conf.d/prod
max_delta = 100:200
git_init = yes
pid_dir = /var/run/coshsh
; Refuse to publish anything when more than this share of template renderings
; fail, leaving the previous run's output untouched (coshsh-cook exits 4).
; Omit it and the recipe publishes whatever rendered, however much failed.
; 0 = abort on a single failure.
max_render_error_pct = 0
; Set to yes only when this recipe deliberately references templates it does
; not ship: absent templates stay counted and logged, but leave the
; max_render_error_pct calculation.
; tolerate_missing_templates = no
; Register custom Jinja2 extensions (file names without .py):
; my_jinja2_extensions = filter_phone,is_critical,global_now

; --- datasources -------------------------------------------------------
[datasource_inventory]
type = csv
name = inventory
dir = /var/lib/inventory

[datasource_monitoring_db]
type = postgres
name = monitoring_db
host = db.example.com
port = 5432
database = inventory
user = coshsh
password = %(COSHSH_DB_PASSWORD)%

; --- datarecipients ----------------------------------------------------
; >>>recipient is the built-in default: writes Nagios-style configs into
; the recipe's objects_dir. Include it unless you really mean to skip it.

[datarecipient_prometheus_sd]
type = prometheus_sd
name = prometheus_sd
target = /etc/prometheus/sd_targets.json

; --- mappings ----------------------------------------------------------
[mapping_locations]
DC1 = datacenter-frankfurt
DC2 = datacenter-amsterdam
DC3 = datacenter-singapore

[mapping_severities]
prod = 24x7
staging = workhours
dev = none
