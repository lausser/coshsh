# Cookbook for the render-error Prometheus metrics tests (spec 007, US5).
#
# Separate from coshsh_renderr.cfg only because of the section below: declaring
# a pushgateway makes every recipe in the file attempt a push, and the other
# render-error tests have no interest in that.
#
# The tests do not need a pushgateway to be running. They replace
# pushadd_to_gateway with a capture function and read the metric values out of
# the registry coshsh handed it, which is both faster and a stronger assertion
# than scraping a real gateway would be.

[defaults]
recipes = PUSH_ALL_KINDS
pid_dir = /var/tmp
log_dir = ./var/log_renderr

[prometheus_pushgateway]
address = 127.0.0.1:9091
username = test
password = testX

[datasource_DS_PUSH_MIXED]
type = renderr
num_good = 1
num_broken = 1
num_missing = 2

[datasource_DS_PUSH_GOOD]
type = renderr
num_good = 3

# A mix of missing and faulty templates, publishing (no tolerance configured).
[recipe_PUSH_ALL_KINDS]
objects_dir = ./var/objects/renderr_push_all
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_PUSH_MIXED
git_init = no

# Same fixture as PUSH_ALL_KINDS. Only the tolerate flag differs, which is what
# makes the pair a valid comparison of what the flag does to the exported values.
[recipe_PUSH_TOLERATE]
objects_dir = ./var/objects/renderr_push_tolerate
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_PUSH_MIXED
tolerate_missing_templates = yes
git_init = no

[recipe_PUSH_ABORT]
objects_dir = ./var/objects/renderr_push_abort
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_PUSH_MIXED
max_render_error_pct = 0
git_init = no

[recipe_PUSH_PUBLISHES]
objects_dir = ./var/objects/renderr_push_publishes
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_PUSH_GOOD
max_render_error_pct = 0
git_init = no
