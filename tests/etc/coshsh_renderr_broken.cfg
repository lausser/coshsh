# The abort half of the output-preservation test (spec 007, US2/US3).
#
# recipe_RENDERR_PRESERVE is declared here with the SAME NAME and the SAME
# objects_dir as in coshsh_renderr.cfg, but fed a datasource whose renderings
# fail. That is what makes the test meaningful:
#
#   1. run RENDERR_PRESERVE from coshsh_renderr.cfg        -> publishes, checksum X
#   2. run RENDERR_PRESERVE from this file                 -> aborts
#   3. objects_dir must still checksum to X                -> nothing was touched
#   4. run RENDERR_PRESERVE from coshsh_renderr.cfg again  -> publishes
#
# Step 4 only works if the abort released the pid lock, and the pid file name is
# derived from the recipe name -- hence the shared name rather than a second one.

[defaults]
recipes = RENDERR_PRESERVE
pid_dir = /var/tmp

[datasource_DS_HALF_BROKEN]
type = renderr
num_good = 5
num_broken = 5

[recipe_RENDERR_PRESERVE]
objects_dir = ./var/objects/renderr_preserve
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_HALF_BROKEN
max_render_error_pct = 0
git_init = no
