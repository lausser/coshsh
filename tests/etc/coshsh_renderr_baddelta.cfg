# A cookbook with a malformed max_delta (spec 007, FR-016a).
#
# This is the pre-existing bug the feature closes, not a new setting. Today
# "max_delta = abc" raises ValueError inside Recipe.__init__, which
# Generator.add_recipe() swallows -- the recipe is dropped, the run continues,
# and RENDERR_BADDELTA_INNOCENT below still publishes, so the operator sees a
# successful run that is silently missing an entire recipe's objects.
#
# After the fix the run refuses to start and neither recipe produces output.
# max_delta's ACCEPTED values are unchanged; only the reaction to an
# unacceptable one changes.

[defaults]
recipes = RENDERR_BADDELTA
pid_dir = /var/tmp

[datasource_DS_ONLY_GOOD]
type = renderr
num_good = 5

[recipe_RENDERR_BADDELTA]
objects_dir = ./var/objects/renderr_baddelta
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_ONLY_GOOD
max_delta = abc
git_init = no

[recipe_RENDERR_BADDELTA_INNOCENT]
objects_dir = ./var/objects/renderr_baddelta_innocent
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_ONLY_GOOD
git_init = no
