# Cookbook for the template-render-error tests (spec 007).
#
# Kept out of etc/coshsh.cfg on purpose: that file is read by most of the suite,
# and a recipe that deliberately aborts does not belong in a cookbook whose
# recipes are expected to succeed.
#
# All recipes here use the ./recipes/renderr fixture tree, whose datasource emits
# one host per render attempt with a known outcome (see
# recipes/renderr/classes/datasource_renderr.py). git_init = no throughout: these
# tests checksum objects_dir, and a git repo inside it would make the checksum
# depend on commit timestamps.

[defaults]
recipes = RENDERR_MISSING
pid_dir = /var/tmp
# Explicit so the logging tests can read back what a run wrote. Without it
# read_cookbook falls back to the system temp dir.
log_dir = ./var/log_renderr

# --- datasources: each declares the mix of render outcomes it produces --------

[datasource_DS_MISSING_ONE]
type = renderr
num_good = 1
num_missing = 1

[datasource_DS_MISSING_MANY]
type = renderr
num_good = 2
num_missing = 5

[datasource_DS_ONLY_GOOD]
type = renderr
num_good = 5

[datasource_DS_HALF_BROKEN]
type = renderr
num_good = 5
num_broken = 5

# 98 good + 2 broken = exactly 2.0% failures
[datasource_DS_TWO_PERCENT]
type = renderr
num_good = 98
num_broken = 2

[datasource_DS_EMPTY]
type = renderr

# One of each failure kind, plus a success, so a single run exercises all three
# counted paths at once.
[datasource_DS_ALL_KINDS]
type = renderr
num_good = 1
num_broken = 1
num_missing = 1
num_raise = 1

# --- US1: missing templates are counted ---------------------------------------

[recipe_RENDERR_MISSING]
objects_dir = ./var/objects/renderr_missing
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_MISSING_ONE
git_init = no

[recipe_RENDERR_MISSING_MANY]
objects_dir = ./var/objects/renderr_missing_many
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_MISSING_MANY
git_init = no

[recipe_RENDERR_TOLERATE]
objects_dir = ./var/objects/renderr_tolerate
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_MISSING_MANY
tolerate_missing_templates = yes
git_init = no

# --- US2: abort on exceeding the tolerance ------------------------------------

# RENDERR_PRESERVE and RENDERR_PRESERVE (in coshsh_renderr_broken.cfg) share an
# objects_dir on purpose: run the good one, checksum, run the broken one, and the
# checksum must be untouched.
[recipe_RENDERR_PRESERVE]
objects_dir = ./var/objects/renderr_preserve
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_ONLY_GOOD
max_render_error_pct = 0
git_init = no

[recipe_RENDERR_WITHIN_TOLERANCE]
objects_dir = ./var/objects/renderr_within
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_TWO_PERCENT
max_render_error_pct = 5
git_init = no

[recipe_RENDERR_NO_TOLERANCE]
objects_dir = ./var/objects/renderr_notol
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_HALF_BROKEN
git_init = no

[recipe_RENDERR_EMPTY]
objects_dir = ./var/objects/renderr_empty
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_EMPTY
max_render_error_pct = 0
git_init = no

[recipe_RENDERR_ABORT]
objects_dir = ./var/objects/renderr_abort
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_HALF_BROKEN
max_render_error_pct = 0
git_init = no

# --- US3: one recipe aborting must not stop the others ------------------------

[recipe_RENDERR_MULTI_BAD]
objects_dir = ./var/objects/renderr_multi_bad
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_HALF_BROKEN
max_render_error_pct = 0
git_init = no

[recipe_RENDERR_MULTI_GOOD]
objects_dir = ./var/objects/renderr_multi_good
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_ONLY_GOOD
git_init = no

# --- US4: all three failure kinds in one run ----------------------------------

[recipe_RENDERR_ALL_KINDS]
objects_dir = ./var/objects/renderr_all_kinds
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_ALL_KINDS
git_init = no

[recipe_RENDERR_ALL_KINDS_ABORT]
objects_dir = ./var/objects/renderr_all_kinds_abort
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_ALL_KINDS
max_render_error_pct = 0
git_init = no
