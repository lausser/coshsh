# A cookbook with an uninterpretable max_render_error_pct (spec 007, FR-016).
#
# The failure mode being guarded against is NOT "coshsh crashes" -- it is coshsh
# quietly dropping this recipe and reporting success, so that every object the
# recipe would have produced silently vanishes from the output. The run must
# refuse to start and name the setting.

[defaults]
recipes = RENDERR_BADPCT
pid_dir = /var/tmp

[datasource_DS_ONLY_GOOD]
type = renderr
num_good = 5

[recipe_RENDERR_BADPCT]
objects_dir = ./var/objects/renderr_badpct
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_ONLY_GOOD
max_render_error_pct = abc
git_init = no

# A second, entirely valid recipe. If the run were to continue past the bad value
# above, this one would produce output -- so its objects_dir staying empty is the
# assertion that "no recipe was processed" rather than "the bad one was skipped".
[recipe_RENDERR_BADPCT_INNOCENT]
objects_dir = ./var/objects/renderr_badpct_innocent
classes_dir = ./recipes/renderr/classes
templates_dir = ./recipes/renderr/templates
datasources = DS_ONLY_GOOD
git_init = no
